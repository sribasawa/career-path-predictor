<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerPath AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-6">
        <div class="text-center mb-6">
            <span class="bg-indigo-50 text-indigo-600 text-xs font-bold px-3 py-1 rounded-full uppercase">VTU Engineering</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-2">CareerPath AI</h1>
            <p class="text-slate-500 text-sm mt-1">Discover your ideal tech domain & roadmap.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Technical Skills</label>
                <input type="text" id="skills" placeholder="e.g., Python, SQL, React" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Preferred Domain</label>
                <select id="domain" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white outline-none">
                    <option>Artificial Intelligence & ML</option>
                    <option>Full-Stack Web Development</option>
                    <option>Cybersecurity</option>
                    <option>Data Science & Analytics</option>
                </select>
            </div>
            <button onclick="alert('Analysis Complete! Best match found for your profile.')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 text-sm cursor-pointer transition">
                Run AI Analysis 🚀
            </button>
        </div>
    </div>
</body>
</html>
